# Génère et publie le sous-site des aubaines chaque matin à 5 h 20 (heure de l'Est),
# soit ~20 min après la reconstruction Make de 5 h. Publication sur GitHub Pages.

name: Aubaines - generation quotidienne

on:
  schedule:
    # Trois passages par jour, pour attraper les offres eclair d'Amazon qui ne
    # durent que quelques heures. Heures UTC ; en HAE (UTC-4) cela donne
    # 5 h 20, midi et 17 h. A decaler d'une heure au passage a l'heure d'hiver.
    - cron: "20 9 * * *"    # 5 h 20 — juste apres la reconstruction Make de 5 h
    - cron: "0 16 * * *"    # midi   — les offres eclair du matin
    - cron: "0 21 * * *"    # 17 h   — celles de l'apres-midi, avant la soiree
  workflow_dispatch:        # bouton pour lancer a la main

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write            # requis par l'etape keepalive

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive - empeche la desactivation auto apres 60 jours
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/site.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: pip install requests
      - name: Generer le site
        run: python generer_site.py
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
      - name: Conserver l'archive et le cache de traductions
        run: |
          if [ -n "$(git status --porcelain archive.json traductions.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add archive.json traductions.json
            git commit -m "Archive et traductions : mise a jour automatique"
            git push
          else
            echo "Rien de nouveau a conserver"
          fi
      - name: Preparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
